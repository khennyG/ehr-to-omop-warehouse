version: "3.9"

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: airflow/Dockerfile
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-omop}:${POSTGRES_PASSWORD:-omop_dev}@postgres:5432/airflow
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    # Read by src/config/settings.py inside the DAG's `python -m src.main`
    # tasks — the pipeline's own warehouse, not Airflow's metadata DB above.
    # POSTGRES_HOST is the docker-compose service name, not localhost, since
    # these tasks run inside the airflow container, on the compose network,
    # not on the host.
    WAREHOUSE_BACKEND: postgres
    POSTGRES_HOST: postgres
    POSTGRES_USER: ${POSTGRES_USER:-omop}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omop_dev}
    POSTGRES_DB: ${POSTGRES_DB:-omop_cdm}
  volumes: &airflow-common-volumes
    - ./airflow/dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./dbt:/opt/airflow/dbt
    - ./data:/opt/airflow/data
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    container_name: omop-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-omop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omop_dev}
      POSTGRES_DB: ${POSTGRES_DB:-omop_cdm}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-omop}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # A one-shot init step, not a long-running service: it runs `airflow db
  # init` (which creates every table LocalExecutor needs in the `airflow`
  # database sql/schema/00_create_airflow_db.sql creates) and the admin
  # user, then exits. webserver and scheduler both wait on it finishing
  # successfully rather than racing each other to initialize the same
  # metadata database — without that dependency, whichever container starts
  # querying first can hit tables the other hasn't created yet.
  airflow-init:
    <<: *airflow-common
    container_name: omop-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - >
        airflow db init &&
        airflow users create --username admin --password admin
        --firstname Admin --lastname User --role Admin --email admin@local.dev

  airflow-webserver:
    <<: *airflow-common
    container_name: omop-airflow
    environment:
      <<: *airflow-common-env
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    command: airflow webserver
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  airflow-scheduler:
    <<: *airflow-common
    container_name: omop-scheduler
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    command: airflow scheduler

volumes:
  pgdata:
  airflow-logs:
